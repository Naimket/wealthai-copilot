[project]
name = "wealthai-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "fastembed>=0.9.0",
    "google-genai>=2.31.0",
    "langchain-community==0.3.27",
    "langchain-google-genai<3",
    "langgraph>=1.0.1",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "ragas==0.4.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8"]
ui = [
    "streamlit>=1.66.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
