# Build the data locally first (see README): scripts/ingest.py and scripts/make_portfolios.py.
# Then:  docker compose up --build   ->  UI on http://localhost:8501, API docs on http://localhost:8000/docs
services:
  api:
    build:
      context: .
      target: api
    env_file: .env          # GEMINI_API_KEY (and optionally GEMINI_MODEL)
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  ui:
    build:
      context: .
      target: ui
    environment:
      WEALTHAI_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
